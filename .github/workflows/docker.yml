# 作者: wjchen
name: docker

# 只在打 v* 标签或手动触发时构建
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # 只构建 x64，避免 QEMU 模拟 arm64 导致编译耗时数倍增长；
  # 需要 arm64 时改为 "linux/amd64,linux/arm64"
  PLATFORMS: linux/amd64

permissions:
  contents: read

jobs:
  build-and-push:
    name: build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- BuildKit：cache mount 复用 Go module 与编译缓存 ----
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=quad
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
          build-args: |
            QUAD_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- 构建报告：digest 直接用 build-push-action 的输出，构建时间从 registry 反查 ----
      - name: Inspect pushed image
        id: inspect
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"

          # digest 来自构建步骤输出，无需再查一次 registry
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "::error::build 步骤未输出 digest"
            exit 1
          fi

          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

          # 单平台镜像的 .Image 是结构体而非 map，不能再用 index 索引
          created="$(docker buildx imagetools inspect "$image" \
            --format '{{json .Image}}' \
            | jq -r '.created // "n/a"')"
          echo "created=${created}" >> "$GITHUB_OUTPUT"

          # manifest 供 artifact 存档
          docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | tee manifest.json

      - name: Write build report
        run: |
          set -euo pipefail
          image="${{ steps.inspect.outputs.image }}"
          digest="${{ steps.inspect.outputs.digest }}"
          built_at="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          {
            echo "### Docker image published"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${image}\` |"
            echo "| Version | \`${{ github.ref_name }}\` |"
            echo "| Digest | \`${digest}\` |"
            echo "| Pinned ref | \`${image}@${digest}\` |"
            echo "| Platforms | $(echo '${{ env.PLATFORMS }}' | tr ',' ' ') |"
            echo "| Image built at | ${{ steps.inspect.outputs.created }} |"
            echo "| Workflow finished at | ${built_at} |"
            echo "| Git ref | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Workflow | [\`#\${{ github.run_number }}\`](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo ""
            echo "Pull by digest:"
            echo '```bash'
            echo "docker pull ${image}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build report
        uses: actions/upload-artifact@v7
        with:
          name: build-report
          path: manifest.json
          if-no-files-found: error
          retention-days: 30
