# 作者: wjchen
name: release

# 打 v* 标签时：构建多架构镜像 + Windows/Linux 二进制，并发布 GitHub Release。
# 手动触发时：只构建产物（dev 版本），不创建 Release。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # aarch64 在 Go / Docker 中的规范写法是 arm64
  PLATFORMS: linux/amd64,linux/arm64

permissions:
  contents: read

jobs:
  binaries:
    name: build binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      # 目标平台：windows + linux，架构：amd64 + arm64（aarch64）
      - name: Build binaries
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for goos in linux windows; do
            for goarch in amd64 arm64; do
              echo "构建 ${goos}/${goarch} (${VERSION})"
              ext=""
              if [[ "${goos}" == "windows" ]]; then
                ext=".exe"
              fi
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
                go build -trimpath -buildvcs=false \
                -ldflags "-s -w -X quad/internal/cli.Version=${VERSION}" \
                -o "dist/quad${ext}" .
              if [[ "${goos}" == "windows" ]]; then
                (cd dist && zip -q "quad_${VERSION}_${goos}_${goarch}.zip" "quad${ext}")
              else
                tar -czf "dist/quad_${VERSION}_${goos}_${goarch}.tar.gz" -C dist "quad${ext}"
              fi
              rm -f "dist/quad${ext}"
            done
          done
          (cd dist && sha256sum ./* > checksums.txt)
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: quad-binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  docker:
    name: build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "image_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "image_tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # 标签版本推 <版本号> 与 latest；手动触发只推 dev-<sha>，避免覆盖 latest。
      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          # GHCR 要求镜像名全小写
          image="${REGISTRY}/$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "value<<EOF"
            echo "${image}:${{ steps.version.outputs.image_tag }}"
            if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
          labels: |
            org.opencontainers.image.title=quad
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.image_tag }}
            org.opencontainers.image.licenses=MIT
          build-args: |
            QUAD_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- 构建报告：digest 直接用 build-push-action 的输出 ----
      - name: Inspect pushed image
        id: inspect
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.value }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image="$(printf '%s\n' "${IMAGE_TAGS}" | head -n1)"
          digest="${BUILD_DIGEST}"
          if [[ -z "${image}" || -z "${digest}" ]]; then
            echo "::error::未能获取镜像 tag 或 digest"
            exit 1
          fi

          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

          # 多架构镜像是 manifest index，直接存档完整 inspect 结果
          docker buildx imagetools inspect "${image}" | tee manifest.txt

      - name: Write build report
        env:
          IMAGE: ${{ steps.inspect.outputs.image }}
          DIGEST: ${{ steps.inspect.outputs.digest }}
        run: |
          set -euo pipefail
          built_at="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          {
            echo "### Docker image published"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Version | \`${{ steps.version.outputs.value }}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Pinned ref | \`${IMAGE}@${DIGEST}\` |"
            echo "| Platforms | $(echo '${{ env.PLATFORMS }}' | tr ',' ' ') |"
            echo "| Workflow finished at | ${built_at} |"
            echo "| Git ref | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Workflow | [\`#\${{ github.run_number }}\`](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo ""
            echo "Pull by digest:"
            echo '```bash'
            echo "docker pull ${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build report
        uses: actions/upload-artifact@v7
        with:
          name: image-manifest
          path: manifest.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: publish release
    needs: binaries
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: quad-binaries
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber --repo "${REPO}"
          else
            gh release create "${TAG}" dist/* \
              --repo "${REPO}" \
              --title "${TAG}" \
              --generate-notes \
              --verify-tag
          fi
